name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build library
        run: npm run build

      # Runtime dependencies must be permissively licensed: this library is
      # embedded in other applications, and a copyleft dependency (the AGPL
      # WISP and TLS clients, for instance) would pass its terms on to them.
      - name: Check runtime dependency licences
        run: node scripts/check-licenses.mjs

      - name: Build example
        working-directory: examples/xterm
        run: |
          npm ci
          npm run build
